<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Dark Red Background Gradient -->
    <linearGradient id="bgRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0005" />
      <stop offset="40%" stop-color="#4c0519" />
      <stop offset="85%" stop-color="#881337" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Vibrant Red & Crimson Glowing Edge & Play Gradient -->
    <linearGradient id="glowRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Hot Coral / Orange Sparkle Accent Gradient -->
    <linearGradient id="sparkRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#ff8533" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Background Card with Red Theme -->
  <rect width="512" height="512" rx="128" fill="url(#bgRedGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#glowRedGrad)" stroke-width="10" opacity="0.9" />

  <!-- Glowing Central Red Play & Sparkle Icon -->
  <g filter="url(#redGlow)">
    <!-- Sleek Rounded Play Triangle Icon -->
    <path d="M192 144 C192 128 208 118 222 126 L384 238 C398 247 398 265 384 274 L222 386 C208 394 192 384 192 368 Z" fill="url(#glowRedGrad)" />
    <!-- Inner White Highlight Triangle -->
    <path d="M216 172 C216 162 226 156 235 162 L344 238 C353 244 353 256 344 262 L235 338 C226 344 216 338 216 328 Z" fill="#ffffff" opacity="0.95" />
  </g>
  
  <!-- Outer Red Sparkles -->
  <path d="M410 110 L420 138 L448 148 L420 158 L410 186 L400 158 L372 148 L400 138 Z" fill="url(#sparkRedGrad)" />
  <path d="M102 368 L109 386 L128 393 L109 400 L102 418 L95 400 L76 393 L95 386 Z" fill="url(#sparkRedGrad)" />
</svg>
