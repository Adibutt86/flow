<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border ring -->
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="#ef4444" stroke-width="6" opacity="0.6" />

  <!-- Red glow blob behind play -->
  <circle cx="256" cy="256" r="140" fill="#dc2626" opacity="0.25" filter="url(#glow)" />

  <!-- Play button triangle -->
  <path d="M190 152 C190 136 207 126 221 134 L376 242 C390 250 390 262 376 270 L221 378 C207 386 190 376 190 360 Z"
        fill="url(#playGrad)" filter="url(#glow)" />

  <!-- Sparkle top-right -->
  <path d="M400 96 L410 122 L436 132 L410 142 L400 168 L390 142 L364 132 L390 122 Z" fill="url(#sparkGrad)" />

  <!-- Sparkle bottom-left -->
  <path d="M108 348 L115 366 L134 373 L115 380 L108 398 L101 380 L82 373 L101 366 Z" fill="url(#sparkGrad)" />
</svg>
